<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>SMS & Email Marketing</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <div class="tabs">
    <button class="tab-button active" data-tab="sms">SMS Messages</button>
    <button class="tab-button" data-tab="email">Email Marketing</button>
  </div>

  <div class="container">
    <div id="smsTab" class="tab-content active">
      <h1>Send SMS Message</h1>
    <form id="smsForm">
      <div class="form-group">
        <label for="phoneNumber">Phone Number:</label>
        <input 
          type="tel" 
          id="phoneNumber" 
          name="phoneNumber" 
          placeholder="+1234567890" 
          required
        >
        <small>Include country code (e.g., +1 for US)</small>
      </div>
      
      <div class="form-group">
        <label for="message">Message:</label>
        <textarea 
          id="message" 
          name="message" 
          rows="4" 
          placeholder="Enter your message here..." 
          required
        ></textarea>
        <small id="charCount">0 / 160 characters</small>
      </div>
      
      <button type="submit" id="sendButton">Send SMS</button>
    </form>
    
    <div id="status" class="status"></div>
    
      <div class="history-section">
        <h2>Message History</h2>
        <div id="messageHistory" class="message-list">
          <p class="loading">Loading messages...</p>
        </div>
      </div>
    </div>

    <div id="emailTab" class="tab-content">
      <h1>Send Email Campaign</h1>
      <form id="emailForm">
        <div class="form-group">
          <label for="recipientEmail">Recipient Email:</label>
          <input 
            type="email" 
            id="recipientEmail" 
            name="recipientEmail" 
            placeholder="user@example.com" 
            required
          >
        </div>
        
        <div class="form-group">
          <label for="emailSubject">Subject:</label>
          <input 
            type="text" 
            id="emailSubject" 
            name="emailSubject" 
            placeholder="Your email subject..." 
            required
          >
        </div>
        
        <div class="form-group">
          <label for="emailMessage">Message:</label>
          <textarea 
            id="emailMessage" 
            name="emailMessage" 
            rows="6" 
            placeholder="Enter your email message here..." 
            required
          ></textarea>
        </div>
        
        <button type="submit" id="sendEmailButton">Send Email</button>
      </form>
      
      <div id="emailStatus" class="status"></div>
      
      <div class="history-section">
        <h2>Email History</h2>
        <div id="emailHistory" class="message-list">
          <p class="loading">Loading emails...</p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
